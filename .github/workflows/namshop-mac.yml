name: Smart Basket Mac app

# Builds "Smart Basket Namibia.app" for Apple-chip and Intel Macs, tests each packaged app
# (self-test, install from the disk image, headless launch), then publishes both .dmg files
# to the "smart-basket-mac" release.
on:
  push:
    branches: ["claude/amazing-mccarthy-sz8fya", "main"]
    paths: ["namshop/**", ".github/workflows/namshop-mac.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: namshop-mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64         # Apple chip (M1 and later)
            python_arch: arm64
            py: python
            numpy_platform: macosx_11_0_arm64
            label: AppleSilicon
          # Intel Macs: the runner is an Apple chip, and setup-python's "x64" Python is a universal
          # build, so every Python command runs as x86_64 under Rosetta via `arch -x86_64`.
          - arch: x86_64
            python_arch: x64
            py: arch -x86_64 python
            numpy_platform: macosx_10_13_x86_64
            label: Intel
    runs-on: macos-15         # macos-14 images are retired in November 2026
    timeout-minutes: 45
    env:
      APP: Smart Basket Namibia
      DMG: Smart-Basket-Namibia-Mac-${{ matrix.label }}.dmg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.python_arch }}
      - name: Make sure Rosetta is available (Intel build)
        if: matrix.arch == 'x86_64'
        run: arch -x86_64 /usr/bin/true || sudo softwareupdate --install-rosetta --agree-to-license
      - name: Check Python architecture
        run: |
          ${{ matrix.py }} -c "import platform, sys; print(platform.machine(), sys.version)"
          test "$(${{ matrix.py }} -c 'import platform; print(platform.machine())')" = "${{ matrix.arch }}"
      - name: Install
        run: |
          ${{ matrix.py }} -m pip install --upgrade pip
          ${{ matrix.py }} -m pip install -r namshop/requirements.txt -r namshop/packaging/requirements-build.txt
          # pip picks numpy's newest-macOS wheel (Accelerate, macOS 14+). Ship the build of the same
          # version that runs on the app's minimum macOS instead.
          NPV=$(${{ matrix.py }} -c 'import numpy; print(numpy.__version__)')
          PYV=$(${{ matrix.py }} -c 'import sys; print("%d.%d" % sys.version_info[:2])')
          ${{ matrix.py }} -m pip download --no-deps --only-binary=:all: --python-version "$PYV" \
            --platform ${{ matrix.numpy_platform }} "numpy==$NPV" -d "$RUNNER_TEMP/np"
          ${{ matrix.py }} -m pip install --no-deps --force-reinstall "$RUNNER_TEMP"/np/numpy-*.whl
      - name: Unit tests
        run: ${{ matrix.py }} -m pytest namshop/tests -q
      - name: Build the app
        run: ${{ matrix.py }} namshop/packaging/build_app.py
      - name: Check the app's architecture
        run: |
          file "dist/$APP.app/Contents/MacOS/$APP"
          file "dist/$APP.app/Contents/MacOS/$APP" | grep -q "${{ matrix.arch }}"
      - name: Check every binary runs on the app's minimum macOS
        run: python namshop/packaging/check_min_macos.py "dist/$APP.app"
      - name: Self-test the packaged app
        run: |
          NAMSHOP_SELFTEST_OUT="$RUNNER_TEMP/selftest.txt" "dist/$APP.app/Contents/MacOS/$APP" --selftest \
            || { cat "$RUNNER_TEMP/selftest.txt"; exit 1; }
          cat "$RUNNER_TEMP/selftest.txt"
          grep -q "^SELFTEST OK" "$RUNNER_TEMP/selftest.txt"
      - name: Sign (ad hoc) and build the disk image
        run: |
          codesign --force --deep --sign - "dist/$APP.app"
          codesign --verify --deep --strict --verbose=2 "dist/$APP.app"
          mkdir -p dmg
          cp -R "dist/$APP.app" dmg/
          ln -s /Applications dmg/Applications
          # hdiutil sometimes fails with "Resource busy" on hosted runners: retry
          for i in 1 2 3; do hdiutil create -volname "$APP" -srcfolder dmg -ov -format UDZO "$DMG" && break; sleep 10; done
          test -f "$DMG"
          hdiutil verify "$DMG"
          shasum -a 256 "$DMG"
          du -h "$DMG"
      - name: Install from the disk image like a user, then run it
        run: |
          hdiutil attach -nobrowse -mountpoint /tmp/sbmnt "$DMG"
          rm -rf "/Applications/$APP.app"
          cp -R "/tmp/sbmnt/$APP.app" /Applications/
          hdiutil detach /tmp/sbmnt || { sleep 5; hdiutil detach -force /tmp/sbmnt; }
          codesign --verify --deep --strict "/Applications/$APP.app"
          NAMSHOP_SELFTEST_OUT="$RUNNER_TEMP/selftest2.txt" "/Applications/$APP.app/Contents/MacOS/$APP" --selftest \
            || { cat "$RUNNER_TEMP/selftest2.txt"; exit 1; }
          # the real launch path, without a window: the app must serve its pages
          NAMSHOP_NO_WINDOW=1 NAMSHOP_REFRESH_HOURS=0 "/Applications/$APP.app/Contents/MacOS/$APP" > launch.txt 2>&1 &
          for i in $(seq 1 60); do grep -q "^http" launch.txt && break; sleep 2; done
          cat launch.txt
          URL=$(grep -m1 "^http" launch.txt)
          test -n "$URL"
          curl -fsS "${URL}healthz"; echo
          curl -fsS "$URL" | grep -q "Smart Basket"
          curl -fsS "${URL}api/meta" | python -c "import json, sys; d = json.load(sys.stdin); assert d['local'] and len(d['stores']) >= 10; print('meta ok')"
          pkill -f "$APP.app/Contents/MacOS/$APP" || true
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DMG }}
          path: ${{ env.DMG }}
          if-no-files-found: error

  release:
    needs: build
    # Publish whichever Mac builds passed, so one stuck runner doesn't hold back the other.
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Check something was built
        run: ls -la *.dmg
      - name: Point the release tag at this build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PATCH "repos/${{ github.repository }}/git/refs/tags/smart-basket-mac" \
            -f sha="${{ github.sha }}" -F force=true || echo "No tag yet: the release step creates it."
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: smart-basket-mac
          name: Smart Basket Namibia — Mac app
          target_commitish: ${{ github.sha }}
          prerelease: false
          make_latest: false
          body: |
            **Which file?** Apple menu → About This Mac. If it says *Chip: Apple M…*, download
            **Smart-Basket-Namibia-Mac-AppleSilicon.dmg**. If it says *Processor: Intel*, download
            **Smart-Basket-Namibia-Mac-Intel.dmg**.

            1. Open the .dmg and drag **Smart Basket Namibia** onto **Applications**.
            2. Open it from Applications. The first time, macOS won't open it because the app isn't
               registered with Apple. Close the message (**Done** on macOS 15, **OK** or **Cancel** on
               earlier versions), then open **System Settings → Privacy & Security**, scroll down, click
               **Open Anyway** next to "Smart Basket Namibia" and confirm. You only do this once.
               On macOS 14 and earlier you can instead Control-click the app and choose **Open**.
               (Or in Terminal: `xattr -dr com.apple.quarantine "/Applications/Smart Basket Namibia.app"`.)
            3. Tap **Refresh** to fetch this week's pamphlets. To have prices read from them automatically,
               tap **🤖 Connect Claude** and paste an Anthropic API key.

            Your lists, pamphlets, settings and Claude key are kept in
            `~/Library/Application Support/Smart Basket Namibia`. The cart and sign-in are kept by the
            app's window. Updating the app keeps all of them.
            Requires macOS 11.3 or later (tested on macOS 15). Built from ${{ github.sha }}.
          fail_on_unmatched_files: false
          files: |
            Smart-Basket-Namibia-Mac-AppleSilicon.dmg
            Smart-Basket-Namibia-Mac-Intel.dmg
